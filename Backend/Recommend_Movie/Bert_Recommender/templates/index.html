<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseReel Movie Recommender</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #results {
      margin-top: 30px;
    }

    .movie-card {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 10px;
      max-width: 500px;
    }

    .movie-card img {
      max-width: 150px;
      float: left;
      margin-right: 15px;
    }

    .spinner {
      display: none;
      margin-top: 20px;
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #no-results {
      font-style: italic;
      color: #777;
    }
  </style>
</head>
<body>
  <h1>PulseReel Movie Recommender</h1>

  <input type="text" id="query" placeholder="Describe a movie..." style="width: 300px;" />
  <button onclick="getRecommendations()">Recommend</button>

  <div class="spinner" id="spinner"></div>
  <div id="results"></div>
  <div id="no-results"></div>

  <script>
    async function getRecommendations() {
      const query = document.getElementById("query").value.trim();
      const resultsDiv = document.getElementById("results");
      const spinner = document.getElementById("spinner");
      const noResults = document.getElementById("no-results");

      resultsDiv.innerHTML = "";
      noResults.innerHTML = "";
      spinner.style.display = "block";

      try {
        const response = await fetch("/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });

        const data = await response.json();
        spinner.style.display = "none";

        if (data.length === 0 || data.error) {
          noResults.innerHTML = "No recommendations found.";
          return;
        }

        for (const movie of data) {
          const movieCard = document.createElement("div");
          movieCard.className = "movie-card";
          movieCard.innerHTML = `
            <img src="${movie.poster}" alt="${movie.title}" />
            <div>
              <h3>${movie.title} — ${movie.score}</h3>
              <p><strong>Genres:</strong> ${movie.genre}</p>
              <p><strong>Director:</strong> ${movie.director}</p>
              <p><strong>Stars:</strong> ${movie.star}</p>
              <p>${movie.overview}</p>
            </div>
            <div style="clear: both;"></div>
          `;
          resultsDiv.appendChild(movieCard);
        }
      } catch (error) {
        spinner.style.display = "none";
        noResults.innerHTML = "An error occurred. Please try again.";
      }
    }
  </script>
</body>
</html>
